<!-- Cabeçalho com menu de serviços. O dropdown é um <details>: abre com clique
     ou teclado, sem depender de hover. O script só trata de o fechar quando se
     clica fora ou se carrega em Esc. -->
<header class="hm-header">
  <div class="wrap hm-nav">
    <a class="brand" href="{{home}}">
      <img class="brand-img" width="457" height="100" src="{{base}}assets/img/logo.png" alt="LGDigital">
    </a>

    <nav class="hm-links" aria-label="Principal">
      <details class="hm-drop">
        <summary>
          Serviços
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="hm-drop-menu">
          <a href="{{base}}seo/">
            <span class="hm-drop-icone">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
            </span>
            <span><b>SEO Local</b><em>Apareces quando procuram perto de ti</em></span>
          </a>
          <a href="{{base}}ads/">
            <span class="hm-drop-icone">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 20 4l-2.5 16.5-5.5-5-4 3v-5.5Z"/></svg>
            </span>
            <span><b>Google &amp; Meta Ads</b><em>Clientes já esta semana</em></span>
          </a>
          <a href="{{base}}websites/">
            <span class="hm-drop-icone">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
            </span>
            <span><b>Websites</b><em>Onde a decisão acontece</em></span>
          </a>
        </div>
      </details>

      <a href="{{home}}#resultados">Resultados</a>
      <a href="{{home}}#faq">FAQ</a>
    </nav>

    <div class="hm-nav-cta">
      <a class="hm-tel" href="tel:+351926289562">+351 926 289 562</a>
      <a class="btn btn--azul btn--sm" href="#agendar">Agenda uma chamada</a>
    </div>
  </div>
</header>
<script>
(function () {
  var d = document.querySelector('.hm-drop');
  if (!d) return;
  document.addEventListener('click', function (e) {
    if (d.open && !d.contains(e.target)) d.open = false;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && d.open) { d.open = false; d.querySelector('summary').focus(); }
  });
})();
</script>
