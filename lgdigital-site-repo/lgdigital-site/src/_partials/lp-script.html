<!-- formulários → webhook do Make; vídeo do YouTube só ao carregar no play -->
<script>
/* formulários → webhook do Make; vídeo do YouTube só ao carregar no play */
(function () {
  // webhook do Make que recebe os emails (landing e páginas de serviço)
  var webhook = 'https://hook.eu2.make.com/ycavs88fby98pqibfxxek4u561bs5ekg';
  window.LG_WEBHOOK = webhook;   // também usado pela candidatura da /gbp/
  var params = new URLSearchParams(location.search);
  var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  // na própria página inicial, logótipos e botões "Subscrever" sobem até ao topo
  // sem recarregar a página (assim os utm_ do anúncio não se perdem)
  if (document.getElementById('inscrever')) {
    [].forEach.call(document.querySelectorAll('a[data-topo]'), function (a) { a.setAttribute('href', '#inscrever'); });
  }

  [].forEach.call(document.querySelectorAll('.lp-form'), function (form) {
    var input = form.querySelector('input[type=email]');
    var botao = form.querySelector('button');
    var msg = form.querySelector('.lp-msg');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (input.value || '').trim();
      msg.className = 'lp-msg';
      if (!ok.test(email)) { msg.textContent = 'Escreve um email válido.'; msg.classList.add('lp-msg--erro'); input.focus(); return; }
      if (!webhook) { msg.textContent = 'O formulário ainda não está ligado. Tenta mais tarde.'; msg.classList.add('lp-msg--erro'); return; }
      var dados = new URLSearchParams();
      dados.append('email', email);
      dados.append('tipo', 'email');   // a candidatura da /gbp/ vai com tipo=candidatura
      dados.append('origem', location.pathname.replace(/^\/|\/$/g, '') || 'inicio');
      dados.append('pagina', location.href.split('#')[0]);
      dados.append('data', new Date().toISOString());
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid'].forEach(function (k) {
        if (params.get(k)) dados.append(k, params.get(k));
      });
      botao.disabled = true;
      // no-cors: pedido simples, sem pré-verificação; a resposta não se lê
      fetch(webhook, { method: 'POST', mode: 'no-cors', body: dados, keepalive: true })
        .then(function () {
          form.classList.add('lp-form--feito');
          msg.textContent = 'Feito! Vê o teu email: as 3 dicas vão a caminho.';
          msg.classList.add('lp-msg--ok');
          // segue para /obrigado/, que dispara o Lead do píxel ao ver esta marca;
          // sem sessionStorage, dispara já aqui
          var marcado = false;
          try { sessionStorage.setItem('lg-lead', '1'); marcado = true; } catch (err) {}
          if (!marcado && window.fbq) fbq('track', 'Lead');
          location.href = '{{base}}obrigado/';
        })
        .catch(function () {
          botao.disabled = false;
          msg.textContent = 'Não foi possível enviar. Tenta outra vez daqui a pouco.';
          msg.classList.add('lp-msg--erro');
        });
    });
  });

  var video = document.querySelector('.lp-video');
  var id = video && (video.getAttribute('data-video') || '').trim();
  if (id) {
    video.classList.add('lp-video--tem');
    var play = video.querySelector('.lp-video-play');
    play.hidden = false;
    play.addEventListener('click', function () {
      video.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
        '?autoplay=1&rel=0" title="Vídeo" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    });
  }
})();
</script>
