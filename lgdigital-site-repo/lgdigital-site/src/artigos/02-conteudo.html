<!-- Igual à /articles do leadarc: título centrado e um cartão por artigo
     (capa 16:9, categoria · data, título e resumo). Com um só artigo, a
     grelha usa --1 (um cartão centrado de 760px); com dois passa a --2, com
     três ou mais tira-se o modificador.
     Para acrescentar um artigo: novo cartão aqui + nova pasta em src/ +
     entrada no PAGES do build.py + sitemap.xml. -->
<main class="lg-main" id="conteudo">

<section class="lg-ar-head">
  <div class="lg-wrap">
    <h1 class="lg-ar-title">Artigos</h1>
  </div>
</section>

<section class="lg-ar-lista">
  <div class="lg-wrap">
    <div class="lg-ar-grid lg-ar-grid--1">

      <article>
        <a class="lg-ar-link" href="{{base}}artigos/anuncios-online/">
          <div class="lg-ar-cover">
            <div class="lg-capa lg-capa--guia" role="img" aria-label="Guia: anúncios online">
              <img class="lg-capa-logo" src="{{base}}assets/img/logo-branco.png" width="457" height="100" alt="">
              <span class="lg-capa-eti">Guia</span>
              <p class="lg-capa-num">Anúncios online</p>
              <p class="lg-capa-sub">tudo o que precisas de saber antes de investir</p>
            </div>
          </div>
          <p class="lg-ar-meta"><span class="cat">Guia</span><span class="ponto" aria-hidden="true">·</span><time datetime="2026-10-20">20 out 2026</time></p>
          <h2 class="lg-ar-h">Tudo o que precisas de saber sobre anúncios online</h2>
          <p class="lg-ar-ex">Como funcionam, quanto investir, o que medir e os erros
            mais comuns. O essencial, sem jargão, antes de gastares o primeiro
            euro.</p>
        </a>
      </article>

    </div>
  </div>
</section>

</main>
