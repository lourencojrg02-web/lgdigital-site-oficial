    <rect x="297" y="438" width="80" height="8" rx="4" fill="#DCD5CA"/><rect x="297" y="454" width="120" height="7" rx="3.5" fill="#E7E1D7"/>
    <rect x="340" y="482" width="60" height="4" rx="2" fill="#D9D3C9"/>

