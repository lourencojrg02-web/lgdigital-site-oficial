    <path d="M517.5 185.5c.8-.8 2.2-.8 3 0l2.3 3c.6.8.6 1.8-.1 2.5l-1.4 1.4c.9 2.2 2.7 4 4.9 4.9l1.4-1.4c.7-.7 1.7-.7 2.5-.1l3 2.3c.8.8.8 2.2 0 3l-1.6 1.6c-1.6 1.6-4 1.9-6.1.9-4.4-2.2-8-5.8-10.2-10.2-1-2.1-.7-4.5.9-6.1z" fill="#fff"/>
    <text x="550" y="188" font-size="14" font-weight="700" fill="#000">Chamada recebida</text>
    <text x="550" y="207" font-size="12" font-weight="500" fill="#8A847A">Cliente da tua zona</text>

    <!-- clientes a subir -->
    <g filter="url(#s)"><rect x="494" y="252" width="206" height="160" rx="16" fill="#fff"/></g>
    <text x="514" y="281" font-size="14" font-weight="700" fill="#000">Clientes</text>
    <rect x="616" y="265" width="68" height="24" rx="12" fill="#E3F6E8"/>
    <text x="650" y="281" font-size="11.5" font-weight="700" fill="#1E8E3E" text-anchor="middle">▲ A subir</text>
    <path d="M514 386C540 380 548 368 566 364S596 344 614 338 646 314 680 300V394H514Z" fill="url(#area)"/>
    <path d="M514 386C540 380 548 368 566 364S596 344 614 338 646 314 680 300" fill="none" stroke="#0091FF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="680" cy="300" r="12" fill="#0091FF" opacity=".18"/>
