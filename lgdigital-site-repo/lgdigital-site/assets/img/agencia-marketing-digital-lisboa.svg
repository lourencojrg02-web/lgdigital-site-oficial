<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" width="730" height="530" role="img" aria-labelledby="t d">
  <title id="t">Agência de marketing digital em Lisboa: Google Ads, Meta Ads, SEO, SEO local e AI SEO</title>
  <desc id="d">Ilustração de um telemóvel com uma pesquisa no Google em que a tua empresa aparece em primeiro, rodeado pelos serviços (Google Ads, Meta Ads, SEO e SEO local, AI SEO), um novo pedido de orçamento, uma chamada recebida, uma nova avaliação e um gráfico de clientes a subir.</desc>
  <defs>
    <clipPath id="c"><rect width="730" height="530" rx="16"/></clipPath>
    <radialGradient id="gAzul" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0091FF" stop-opacity=".22"/><stop offset="1" stop-color="#0091FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gVerde" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2FBA51" stop-opacity=".16"/><stop offset="1" stop-color="#2FBA51" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0091FF" stop-opacity=".25"/><stop offset="1" stop-color="#0091FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
